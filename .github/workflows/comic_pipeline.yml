name: Graphic Document Pipeline

on:
  repository_dispatch:
    types: [comic_event]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Generic Comic Task ID'
        required: true
        default: 'task_cm01_001'
      payload:
        description: 'Base64 Encoded Comic Payload'
        required: false

jobs:
  process-comic:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow reportlab beautifulsoup4 google-api-python-client google-auth gspread

      - name: Execute Comic Processor
        env:
          GDRIVE_SA_BASE64: ${{ secrets.GDRIVE_SA_BASE64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CF_RELAY_URL: ${{ secrets.CF_RELAY_URL }}
          CF_RELAY_SECRET: ${{ secrets.CF_RELAY_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GSHEET_QUEUE_ID: ${{ secrets.GSHEET_QUEUE_ID }}
          TASK_ID: ${{ github.event.client_payload.task_id || inputs.task_id }}
          TASK_PAYLOAD: ${{ github.event.client_payload.payload || inputs.payload }}
        run: |
          python3 comic_processor.py
